<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#eaf7fb">
    <title>Admin Login — Barangay Abang</title>
    <link rel="stylesheet" href="../../css/admin.css">
  </head>
  <body class="login-page">
    <main class="login-card" id="main">
      <aside class="login-brand">
        <img class="login-seal" src="../../assets/barangay-seal.jpg" alt="Barangay Abang official seal">
        <p class="login-title">Barangay Abang</p>
        <p class="eyebrow">ADMIN PORTAL</p>
        <p class="tagline">Secure. Efficient. For a Better Community.</p>
      </aside>

      <section class="login-form-wrap">
        <form class="login-form" id="adminLoginForm" aria-labelledby="loginTitle" novalidate>
          <h1 id="loginTitle">Admin Login</h1>
          <p class="intro">Enter your credentials to access the admin panel.</p>
          <p class="login-error" id="loginError" role="alert"></p>

          <div class="field">
            <label for="adminEmail">Email</label>
            <span class="input-wrap">
              <span class="field-icon" aria-hidden="true">✉</span>
              <input id="adminEmail" name="email" type="email" placeholder="Admin email" autocomplete="username" required>
            </span>
          </div>

          <div class="field">
            <label for="adminPassword">Password</label>
            <span class="input-wrap">
              <span class="field-icon" aria-hidden="true">♙</span>
              <input id="adminPassword" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
              <button class="toggle-password" type="button" data-toggle="adminPassword" aria-label="Show password" aria-pressed="false">◉</button>
            </span>
          </div>

          <button class="primary-btn" type="submit">Login</button>
          <p class="login-note">First time here? <a class="text-link" href="../signup/index.html">Set up the admin account</a></p>
          <button class="preview-link" type="button" id="previewButton">Preview empty dashboard</button>
          <p class="login-note">Live complaints and records are visible only after signing in with the allowlisted admin account.</p>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/supabase-client.js"></script>
    <script src="../../js/admin-auth-shared.js"></script>
    <script src="../../js/admin-login.js"></script>
  </body>
</html>
